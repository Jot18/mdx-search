name: Scrape MDX

on:
  schedule:
    # Mon & Thu at 15:00 UTC (~7-8am Pacific)
    - cron: "0 15 * * 1,4"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    # PATH B (reliable): runs on your SGN-PC29 self-hosted runner (home IP).
    # To try PATH A (GitHub cloud, zero local footprint) instead, change the
    # next line to:  runs-on: ubuntu-latest
    runs-on: self-hosted

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Install Chromium
        # ubuntu-latest needs --with-deps; a self-hosted Windows runner ignores it.
        run: python -m playwright install --with-deps chromium || python -m playwright install chromium

      - name: Scrape
        run: python mdx_search.py

      - name: Commit results
        run: |
          git config user.name "mdx-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "*.csv" || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "MDX scrape $(date -u +%Y-%m-%d)"
            git push
          fi
